# plugin.conf - what the shared plugin kit needs to know about this plugin.
NAME=asustor-control
TITLE="Asustor Control"
SUMMARY="Drives the front-panel LCD and LEDs of an Asustor NAS running Unraid, and shows what the fan, CPU and disks are doing."
PARENT=AsustorControl
ABOUT_ORDER=3
REPO=https://github.com/luuvasara/unraid-asustor-control
EXEC="etc/rc.d/rc.asustor-control usr/local/bin/asustor-lcd usr/local/bin/asustor-hwmon usr/local/bin/asustor-leds usr/local/bin/asustor-buttons usr/local/bin/asustor-drivercheck usr/local/bin/asustor-kmods"
