# plugin.conf - what the shared plugin kit needs to know about this plugin.
NAME=asustor-control
TITLE="Asustor Control"
SUMMARY="Drives the front-panel LCD and LEDs of an Asustor NAS running Unraid; shows the unit as it looks with its bays live, bay labels on the Main page, the fan, CPU and disk history, a hardware inventory with known issues and firmware, and an anonymised hardware report."
PARENT=AsustorControl
ABOUT_ORDER=7
REPO=https://github.com/luuvasara/unraid-asustor-control
EXEC="etc/rc.d/rc.asustor-control usr/local/bin/asustor-lcd usr/local/bin/asustor-hwmon usr/local/bin/asustor-leds usr/local/bin/asustor-buttons usr/local/bin/asustor-drivercheck usr/local/bin/asustor-kmods usr/local/emhttp/plugins/asustor-control/scripts/ac-report"
ENCLOSURE_BADGES=yes
