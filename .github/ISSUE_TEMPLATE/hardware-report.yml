name: Hardware report
description: An Asustor unit the plugin does not recognise or draws wrong, or an LCD, LED or sensor that does not work. Made with the plugin's Report tab.
title: "Hardware report: "
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The Report tab (Utilities, Asustor Control, Report) fills in the report below and anonymises it on your server before it reaches this page.
        Please read it once more before you submit: serial numbers, MAC addresses, WWNs, UUIDs, labels, the hostname, IP addresses and user names should all show as placeholders such as `<serial-1>`.
  - type: input
    id: model
    attributes:
      label: Asustor model
      description: As printed on the label, e.g. "AS6706T (Lockerstor 6 Gen2)".
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong?
      description: e.g. "the LCD stays blank", "no fan RPM on the Overview", "Locate lights bay 2 for the drive shown in bay 1".
    validations:
      required: true
  - type: textarea
    id: body
    attributes:
      label: Hardware report
      description: Filled in by the plugin. If the report was too long for a link, attach the downloaded asustor-control-report-*.txt here instead. Add the last lines of /var/log/asustor-lcd.log if the LCD is the problem.
      render: text
    validations:
      required: true
